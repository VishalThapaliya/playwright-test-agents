                - heading "Nicolas Chabanoles" [level=4] [ref=f4e151]
                - paragraph [ref=f4e153]: I hired Bishal several years ago to bring some front-end expertise to the team. Over the years, Bishal has brought his creativity and autonomy to the team to improve the User Experience of our products. Bishal is very easy to work with and is always willing to learn more to help his teammates the best.
            - listitem [ref=f4e154]:
