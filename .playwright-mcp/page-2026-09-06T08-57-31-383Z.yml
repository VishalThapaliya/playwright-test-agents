                - heading "Pablo Alonso" [level=4] [ref=f4e158]
                - paragraph [ref=f4e160]: I had the pleasure of working with Bishal at Bonitasoft. Beyond his contagious optimism and great team spirit, he brought real value with his sharp eye for design and user experience. His fresh perspective transformed our product interfaces, making them more modern, intuitive, and impactful. Any team would be lucky to have him onboard.
